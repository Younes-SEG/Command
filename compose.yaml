services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: folio_local
      POSTGRES_DB: folio
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - folio-postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U folio -d folio']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  folio-postgres:
